# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# CodeRabbit configuration.
#
# Specs and other prose stay in scope on purpose: documentation in this repo carries
# engineering substance, and review has repeatedly found real defects in docs-only
# changes.
reviews:
  auto_review:
    # One review per pull request rather than a full re-review on every push.
    auto_incremental_review: false

    # Mechanical changes with nothing for a reviewer to find. Substring match,
    # case-insensitive — deliberately narrow, so chore(engine) and docs(modules) are
    # still reviewed.
    ignore_title_keywords:
      - "chore(ci)"
      - "docs(status)"
